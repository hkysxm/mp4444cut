name: QingCut Windows x64
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.13.1'
          cache: npm
      - run: npm ci
      - name: Download and verify FFmpeg
        run: |
          ./scripts/setup-ffmpeg.ps1
          "$env:GITHUB_WORKSPACE\vendor" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build Windows portable ZIP
        run: npm run build:win -- --publish never
      - name: Test with bundled decoder
        run: |
          foreach ($name in @('ffmpeg', 'ffprobe')) {
            $actual = (Get-Command "$name.exe").Source
            $expected = Join-Path $env:GITHUB_WORKSPACE "vendor/$name.exe"
            if ($actual -ne $expected) { throw "Wrong decoder: $actual" }
            & $actual -version
            if ($LASTEXITCODE -ne 0) { throw "$name failed" }
          }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify package and generate SHA-256
        run: |
          $zips = @(Get-ChildItem release/QingCut-*-Windows-x64.zip)
          if ($zips.Count -ne 1) { throw 'Expected one release ZIP' }
          $zip = $zips[0]
          $dest = Join-Path $env:RUNNER_TEMP 'qingcut-package-check'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $dest
          foreach ($file in @('QingCut.exe', 'resources/ffmpeg/ffmpeg.exe', 'resources/ffmpeg/ffprobe.exe', 'resources/app.asar')) {
            if (!(Test-Path (Join-Path $dest $file))) { throw "Missing $file" }
          }
          foreach ($name in @('ffmpeg.exe', 'ffprobe.exe')) {
            if ((Get-FileHash "$dest/resources/ffmpeg/$name").Hash -ne (Get-FileHash "vendor/$name").Hash) { throw "Packaged binary mismatch: $name" }
          }
          $hash = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($zip.Name)" | Set-Content -LiteralPath "$($zip.FullName).sha256" -Encoding ascii
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: QingCut-Windows-x64
          path: |
            release/QingCut-*-Windows-x64.zip
            release/QingCut-*-Windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
